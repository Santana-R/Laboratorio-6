<rect width="800" height="450" fill="#0c1e2b"/>
<rect width="800" height="450" fill="url(#cuadricula)"/>
<text x="42" y="42" font-family="Arial, sans-serif" font-size="17" fill="#19c5c8" text-anchor="start">03 / AJUSTA TU SIGUIENTE SESIÓN</text><circle cx="400" cy="222" r="123" fill="#102536" stroke="#29455a" stroke-width="3"/><circle cx="400" cy="222" r="87" fill="none" stroke="#416079" stroke-width="2"/><circle cx="400" cy="222" r="48" fill="#19c5c8" opacity=".14"/><circle cx="400" cy="222" r="14" fill="#19c5c8"/><path d="M520 115L400 222" fill="none" stroke="#ffa31a" stroke-width="6" marker-end="url(#puntaPrioridad)"/><text x="170" y="230" font-family="Arial, sans-serif" font-size="19" fill="#b6c4cf" text-anchor="middle">Observar</text><text x="645" y="230" font-family="Arial, sans-serif" font-size="19" fill="#b6c4cf" text-anchor="middle">Elegir</text><text x="400" y="415" font-family="Arial, sans-serif" font-size="21" fill="#f4f8fb" text-anchor="middle">Trabaja una prioridad cada vez.</text>
